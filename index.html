function supportView(){const level=state.supportLevel;const all=state.tickets;const visible=all.filter(t=>level==='first'?t.status==='first':t.status==='second'||t.status==='waiting'||t.status==='closed'&&t.handledLevel==='second');const selected=selectedTicket();const t=selected&&(visible.includes(selected)||selected.status==='waiting'||selected.status==='closed')?selected:null;return '<div class="page-heading"><div><div class="flow-tag">Support · '+(level==='first'?'Peter Müller':'Erika Mustermann')+'</div><h1>'+(level==='first'?'Weniger Sortieren. Mehr Lösen.':'Vollständiger Kontext. Gezielte Hilfe.')+'</h1><p>'+(level==='first'?'Regelbasiert vorsortierte Tickets mit Prüfliste und Wissensquellen.':'Übergaben mit Begründung, Dialog und bereits geprüften Schritten.')+'</p></div>'+button('seed','Beispielfall laden','soft')+'</div><div class="tabs" aria-label="Supportebene"><button class="'+(level==='first'?'active':'')+'" data-action="level" data-value="first">1st Level · '+all.filter(t=>t.status==='first').length+'</button><button class="'+(level==='second'?'active':'')+'" data-action="level" data-value="second">2nd Level · '+all.filter(t=>t.status==='second').length+'</button></div><div class="stats"><div class="stat"><strong>'+all.filter(t=>!['closed','waiting'].includes(t.status)).length+'</strong><span>Offene Demo-Tickets</span></div><div class="stat"><strong>'+all.filter(t=>t.status==='waiting').length+'</strong><span>Warten auf Bestätigung</span></div><div class="stat"><strong>'+all.filter(t=>t.status==='closed').length+'</strong><span>Bestätigt gelöst</span></div></div>'+(all.length===0?'<section class="card empty"><div class="empty-icon" aria-hidden="true">▤</div><h3>Keine Tickets in dieser Sitzung.</h3><p>Durchlaufen Sie die Selbsthilfe oder laden Sie einen fiktiven Fall für eine schnelle Vorführung.</p>'+button('seed','Beispielfall laden','primary','style="margin-top:18px"')+'</section>':'<div class="support-grid"><aside class="support-list" aria-label="Tickets dieser Supportebene">'+(visible.length?ticketRows(visible,true):'<div class="notice neutral">Keine Tickets auf dieser Ebene. Wechseln Sie die Ebene oder legen Sie einen neuen Fall an.</div>')+'</aside><div>'+(t?supportDetail(t):'<section class="card empty"><h3>Ticket auswählen</h3><p style="margin-top:8px">Öffnen Sie einen Fall aus der Liste, um Kontext, Checkliste und Übergabe zu sehen.</p></section>')+'</div></div>')+footer();}
function supportDetail(t){const second=state.supportLevel==='second';const editable=t.status==='first'||t.status==='second';const r=KB[t.rule];const checks=second?t.expert:t.checks;return '<section class="card"><div class="card-head"><div><span class="ticket-id">TICKET #'+t.id+' · '+esc(t.user)+'</span><h2 style="margin-top:5px">'+esc(t.subject)+'</h2></div><span class="badge cyan">'+status(t)+'</span></div><div class="card-body"><div class="detail-grid"><div><div class="notice"><strong>Zusammenfassung</strong><br>'+esc(t.detail||'Keine weitere Rückfrage dokumentiert.')+'<br>'+esc(t.impact)+'. '+(t.rule==='unknown'?'Zuordnung unklar – manuelle Prüfung nötig.':'Selbsthilfe reichte nicht aus.')+'</div><div class="split-fields" style="margin-top:17px"><div class="field"><label for="categorySelect">Kategorie korrigieren</label><select id="categorySelect" data-id="'+t.id+'" '+(!editable?'disabled':'')+'>'+[...RULES,UNKNOWN].map(x=>'<option value="'+x.id+'" '+(x.id===t.rule?'selected':'')+'>'+esc(x.category)+'</option>').join('')+'</select></div><div class="field"><label for="prioritySelect">Priorität prüfen</label><select id="prioritySelect" data-id="'+t.id+'" '+(!editable?'disabled':'')+'><option '+(t.priority==='Normal'?'selected':'')+'>Normal</option><option '+(t.priority==='Hoch'?'selected':'')+'>Hoch</option></select></div></div><div class="section-label">'+(second?'Schon im 1st Level geprüft':'Empfohlene Prüfcheckliste')+'</div>'+ (second?'<ul class="step-list">'+t.checks.map(c=>'<li><span class="step-num">'+(c.done?'✓':'–')+'</span><span>'+esc(c.text)+(c.done?'':' · Noch offen')+'</span></li>').join('')+'</ul><div class="section-label">Prüfung im Fachsupport</div>':'')+'<div class="checklist">'+checks.map((c,i)=>'<label><input type="checkbox" data-check="'+(second?'expert':'checks')+'" data-index="'+i+'" data-id="'+t.id+'" '+(c.done?'checked':'')+' '+(!editable?'disabled':'')+'><span>'+esc(c.text)+'</span></label>').join('')+'</div><div class="section-label">Interne Bearbeitungsnotizen</div>'+(t.notes.length?'<div class="transcript">'+t.notes.map(n=>'<p><strong>'+esc(n.who)+' · '+time(n.time)+'</strong>'+esc(n.text)+'</p>').join('')+'</div>':'<p class="small muted">Noch keine Notizen.</p>')+(editable?'<div class="field"><label for="noteInput">Neue Notiz</label><textarea id="noteInput" maxlength="1200" placeholder="Ergebnis, Beobachtung oder nächster Schritt …"></textarea></div>'+button('save-note','Notiz speichern','','data-id="'+t.id+'"'):'')+'<div class="section-label">Vollständiger Dialog</div>'+transcript(t)+(t.messages.length?'<div class="section-label">Ergänzende Ticketnachrichten</div><div class="transcript">'+t.messages.map(m=>'<p><strong>'+esc(m.who)+' · '+time(m.time)+'</strong>'+esc(m.text)+'</p>').join('')+'</div>':'')+'</div><aside class="stack"><section><h3>Routing-Vorschlag</h3><p class="small muted" style="margin-top:8px">'+esc(t.routingReason)+'</p><div class="sources"><span class="source">'+esc(r.source)+'</span></div><div class="notice neutral" style="margin-top:14px"><strong>Fachteam: '+esc(r.team)+'</strong><br>Vorschläge werden vom Support geprüft. Keine automatische Systemänderung.</div>'+(t.status==='first'?button('escalate','An 2nd Level weiterleiten','primary full','data-id="'+t.id+'" style="margin-top:13px"'):'')+'</section><section><h3>Lösung dokumentieren</h3>'+(editable?'<div class="field"><label for="solutionInput">Nachricht an '+esc(t.user.split(' ')[0])+'</label><textarea id="solutionInput" maxlength="1500" placeholder="Was wurde gelöst? Was soll die Person testen?">'+esc(t.solution)+'</textarea></div><label class="small" style="display:flex;gap:8px"><input type="checkbox" id="approval" style="accent-color:var(--cyan)">Lösung fachlich geprüft und zur Rückmeldung freigegeben.</label>'+button('propose-solution','Lösung zur Bestätigung senden','primary full','data-id="'+t.id+'" style="margin-top:13px"')+'<p class="small muted" style="margin-top:9px">Der Abschluss erfolgt erst nach Bestätigung durch die hilfesuchende Person.</p>':t.solution?'<div class="notice" style="margin-top:10px">'+esc(t.solution)+'</div>':'<p class="small muted">Noch keine Lösung dokumentiert.</p>')+'</section>'+(['waiting','closed'].includes(t.status)?button('back-user','Zur Bestätigung wechseln','soft full','data-id="'+t.id+'"'):'')+(t.status==='closed'?'<section><h3>Wissen sichern</h3><p class="small muted" style="margin-top:8px">'+esc(t.knowledge)+'</p>'+button('knowledge-review','Zur Wissensprüfung vormerken','small full','data-id="'+t.id+'" style="margin-top:10px" '+(t.knowledge!=='Nicht vorgemerkt'?'disabled':''))+'</section>':'')+'<section><h3 style="margin-bottom:15px">Aktivitätsverlauf</h3>'+timeline(t)+'</section></aside></div></div></section>'+journey(t.status==='closed'||t.status==='waiting'?5:t.status==='second'?4:3);}
function knowledgeView(){const query=normalize(state.kbSearch);const results=RULES.filter(r=>normalize(r.title+' '+r.category+' '+r.words.join(' ')).includes(query));return '<div class="page-heading"><div><div class="flow-tag">Wissen · Statische Demo-Anleitungen</div><h1>Bekanntes Wissen. Direkt nutzbar.</h1><p>Fünf Beispielartikel bilden die regelbasierte Selbsthilfe ab – keine echten internen Dokumente.</p></div>'+button('rules','Erkennungsregeln ansehen','soft')+'</div><label for="kbSearch" class="small muted" style="display:block;margin-bottom:7px">Artikel und Themen suchen</label><input class="search" id="kbSearch" type="search" value="'+esc(state.kbSearch)+'" placeholder="Zum Beispiel: Drucker, Passwort, VPN …"><div class="kb-grid" id="kbResults">'+kbCards(results)+'</div>'+footer();}
function kbCards(results){return results.length?results.map(r=>'<article class="card kb-card"><span class="badge">'+esc(r.category)+'</span><h2>'+esc(r.title)+'</h2><p>'+esc(r.source)+' · Beispielinhalt</p><ol class="step-list">'+r.steps.map((s,i)=>'<li><span class="step-num">'+(i+1)+'</span><span>'+esc(s)+'</span></li>').join('')+'</ol>'+button('kb-help','Mit diesem Thema Hilfe starten','soft','data-value="'+r.id+'"')+'</article>').join(''):'<div class="card no-results">Keine passende Demo-Anleitung gefunden. Sie können das Anliegen über „Hilfe starten“ zur manuellen Klärung übergeben.</div>';}
const scenarios={accounting:'Meine Buchhaltungsanwendung startet nicht.',printer:'Mein Drucker druckt nicht. Der Auftrag bleibt hängen.',login:'Ich habe mein Passwort vergessen und kann mich nicht anmelden.',hr:'Wie kann ich einen Urlaubsantrag in der HR-Anwendung eintragen?',vpn:'Meine VPN-Verbindung funktioniert nicht.'};
function startScenario(id){newSession();if(id==='hr'){state.session.user='Michael Schneider';state.session.department='HR';state.session.messages[0].text='Hallo Michael! Wie kann ich Sie bei Ihrem IT-Anliegen unterstützen?';}sendChat(scenarios[id]||'Ich benötige Hilfe.');}
function seed(){const savedRole=state.role;startScenario('accounting');sendChat('Verbindung zum Server nicht möglich.');msg('user','Die drei Selbsthilfe-Schritte haben nicht geholfen.');state.session.phase='preview';state.session.impact='Arbeit unterbrochen';createTicket();state.role=savedRole==='support'?'support':'user';state.page=state.role==='support'?'support':'help';state.supportLevel='first';render();toast('Fiktiver Fall #'+state.session.ticketId+' geladen.');}
function supportPerson(){return state.supportLevel==='first'?'Peter Müller':'Erika Mustermann';}
function hasDraft(){const s=state.session;return !s.ticketId&&!['start','solved'].includes(s.phase);}
let lastFocus;
function openModal(title,body){lastFocus=document.activeElement;$('#modalHost').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">'+esc(title)+'</h2><button class="close" id="closeModal" aria-label="Dialog schließen">×</button></div><div class="modal-content">'+body+'</div></section></div>';$('#closeModal').focus();}
function closeModal(){if(!$('#modalHost').innerHTML)return;$('#modalHost').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function explain(){openModal('Über diesen Prototypen','<div class="notice">Klickbare Konzeptdemo. Es gibt keinen KI-Agenten, kein Training, keinen Server und keine Verbindung zu Unternehmenssystemen.</div><h3 style="margin-top:20px">Was Sie vorführen können</h3><ol><li>Anliegen eingeben und regelbasierte Zuordnung sehen.</li><li>Eine Rückfrage beantworten und Selbsthilfe testen.</li><li>Ohne Ticket abschließen oder mit vollständigem Kontext übergeben.</li><li>Als 1st Level Checkliste abarbeiten, Notizen speichern und weiterleiten.</li><li>Als 2nd Level Lösung dokumentieren und freigeben.</li><li>Als hilfesuchende Person die Lösung bestätigen oder zurückgeben.</li></ol><h3>Veröffentlichung mit GitHub Pages</h3><ol><li>Speichern Sie diese HTML-Datei unter dem Namen <code>index.html</code>.</li><li>Erstellen Sie auf GitHub ein Repository ohne vertrauliche Inhalte. Laden Sie die Datei in das Hauptverzeichnis des Branches <code>main</code> und committen Sie die Änderung.</li><li>Öffnen Sie <strong>Settings → Pages</strong>. Wählen Sie <strong>Deploy from a branch</strong>, anschließend <code>main</code> und <code>/(root)</code>, und speichern Sie.</li><li>Nach erfolgreicher Bereitstellung zeigt GitHub dort die Adresse der Seite an. Bei einem Projekt-Repository hat sie normalerweise die Form <code>https://BENUTZERNAME.github.io/REPOSITORY/</code>.</li></ol><p>Ob GitHub Pages für ein Repository verfügbar ist, hängt vom Kontotarif und gegebenenfalls von Unternehmensrichtlinien ab. Deployment und Repository-Erstellung müssen Sie selbst durchführen.</p><h3>Grenzen & Datenschutz</h3><p>Alle Daten leben nur im Arbeitsspeicher dieses Browser-Tabs. Beim Neuladen geht der gesamte Zustand verloren. Andere Besucher sehen eigene, getrennte Sitzungen. Keine Passwörter, echten Personal-, Kunden- oder Ticketdaten eingeben. Die Seite selbst nutzt weder Cookies noch Browser-Speicher oder externe Dienste.</p><p>Die Priorität ist ein vereinfachter Regelvorschlag anhand der angegebenen Auswirkung, kein SLA. Quellen und Anleitungen sind fiktiv. Die Erkennung versteht weder beliebige Formulierungen noch technische Zusammenhänge. Bei unklaren Anliegen erfolgt eine manuelle Zuordnung.</p><div class="actions">'+button('rules','Schlüsselwort-Regeln ansehen','soft')+button('reset-confirm','Gesamte Demo zurücksetzen','')+'</div>');}
function ruleModal(){openModal('Schlüsselwort-Erkennung statt KI','<p>Der Text wird kleingeschrieben und vereinheitlicht. Danach sucht der Algorithmus nach Begriffen an Wortgrenzen. Buchhaltung und HR werden als spezifische Anwendungsthemen bevorzugt; danach gilt die erste passende Regel. Bei Mehrdeutigkeit kann diese einfache Zuordnung falsch sein und ist vom Support korrigierbar.</p><table class="rule-table"><thead><tr><th>Thema</th><th>Beispielbegriffe</th><th>Fachteam</th></tr></thead><tbody>'+RULES.map(r=>'<tr><td>'+esc(r.title)+'</td><td>'+esc(r.words.join(', '))+'</td><td>'+esc(r.team)+'</td></tr>').join('')+'<tr><td>Keine passende Regel</td><td>Freie weitere Anliegen</td><td>Manuelle Triage</td></tr></tbody></table><p>Die Rückfrage ist fest vorgegeben. Ihre Antwort wird als Kontext übernommen, führt aber nicht zu einer individuellen Diagnose. Für Selbsthilfe-Rückmeldungen gibt es zusätzliche einfache Textregeln. Die sichtbaren Schaltflächen funktionieren zuverlässig auch dann, wenn der Freitext nicht verstanden wird.</p><p>Für die Priorität gilt: „Arbeit unterbrochen“ → „Hoch“, alle anderen Auswirkungen → „Normal“. Supportmitarbeitende können den Vorschlag korrigieren.</p><p>Zum Erweitern können Entwickler die Liste <code>RULES</code> in dieser Datei um Schlüsselwörter, Rückfragen, Anleitungen und Fachteams ergänzen. Reale Wissensquellen und Automatisierungen benötigen später einen gesicherten Backend-Dienst, Rollenprüfung und Freigabeprozesse.</p>');}
function confirmNew(action,value){openModal('Aktuelles Anliegen verwerfen?','<p>Der aktuelle Dialog wurde noch nicht als Ticket übergeben. Bei einem neuen Anliegen wird dieser Entwurf verworfen. Bereits angelegte Tickets bleiben erhalten.</p><div class="actions">'+button('confirmed-new','Neues Anliegen starten','primary','data-next="'+action+'" data-value="'+esc(value||'')+'"')+button('close','Abbrechen','')+'</div>');}
function handle(action,el){const id=Number(el?.dataset.id);const t=state.tickets.find(x=>x.id===id);switch(action){
 case'role':state.role=el.dataset.value;state.page=state.role==='user'?'help':'support';if(state.role==='support'){const ct=currentTicket();if(ct){state.selected=ct.id;state.supportLevel=ct.status==='second'||ct.handledLevel==='second'?'second':'first';}}render();break;
 case'page':state.page=el.dataset.value;if(state.page==='tickets')state.selected=null;render();break;
 case'about':explain();break;case'rules':ruleModal();break;case'close':closeModal();break;
 case'new':if(hasDraft())confirmNew('new');else newSession();break;
 case'scenario':case'kb-help':if(hasDraft())confirmNew('scenario',el.dataset.value);else startScenario(el.dataset.value);break;
 case'confirmed-new':{const next=el.dataset.next,val=el.dataset.value;closeModal();if(next==='seed')seed();else if(next==='scenario')startScenario(val);else newSession();break;}
 case'answer':sendChat(el.dataset.value);break;
 case'self-solved':if(state.session.phase!=='guide')break;msg('user','Ja, das Problem ist gelöst.');msg('assistant','Vielen Dank! Durch Selbsthilfe gelöst – kein Ticket erforderlich.');state.session.phase='solved';render();break;
 case'need-ticket':if(state.session.phase!=='guide')break;msg('user','Die Anleitung hat nicht geholfen. Ich benötige weitere Unterstützung.');msg('assistant','Ich bereite ein Ticket mit Ihren bisherigen Angaben vor. Bitte prüfen Sie die Auswirkung und bestätigen Sie die Übergabe.');state.session.phase='preview';render();break;
 case'create-ticket':createTicket();break;
 case'open-support':if(!t)break;state.role='support';state.page='support';state.selected=t.id;state.supportLevel=t.status==='second'||t.handledLevel==='second'?'second':'first';render();break;
 case'level':state.supportLevel=el.dataset.value;state.selected=null;render();break;
 case'select-ticket':state.selected=id;render();break;
 case'user-ticket':state.selected=id;render();break;
 case'back-tickets':state.selected=null;render();break;
 case'seed':if(hasDraft())confirmNew('seed');else seed();break;
 case'save-note':{if(!t||!['first','second'].includes(t.status))break;const input=$('#noteInput'),text=input.value.trim();if(!text){toast('Bitte eine Notiz eingeben.');input.focus();break;}t.notes.push({who:supportPerson(),text,time:stamp()});log(t,'Bearbeitungsnotiz gespeichert.',supportPerson());render();toast('Notiz gespeichert.');break;}
 case'escalate':{if(!t||t.status!=='first')break;const draft=$('#noteInput')?.value.trim();if(draft){toast('Speichern Sie zuerst Ihre offene Notiz.');$('#noteInput').focus();break;}openModal('Ticket #'+t.id+' weiterleiten','<p><strong>Fachteam: '+esc(KB[t.rule].team)+'</strong></p><p>'+esc(t.routingReason)+'</p><div class="notice">Alle Dialogangaben, Notizen und Prüfergebnisse werden mitgegeben. '+t.checks.filter(c=>!c.done).length+' Prüfschritt(e) sind noch offen und werden ausdrücklich als offen übergeben.</div><p>Die Weiterleitung ist eine menschliche Entscheidung – keine automatisch ausgeführte KI-Aktion.</p><div class="actions">'+button('do-escalate','Übergabe bestätigen','primary','data-id="'+t.id+'"')+button('close','Abbrechen','')+'</div>');break;}
 case'do-escalate':if(!t||t.status!=='first')break;t.status='second';t.owner=KB[t.rule].team;t.handledLevel='second';log(t,'An '+t.owner+' weitergeleitet. '+t.checks.filter(c=>c.done).length+' von '+t.checks.length+' Prüfungen abgeschlossen.', 'Peter Müller');if(currentTicket()?.id===t.id)msg('system','Ticket #'+t.id+' wurde an '+t.owner+' weitergeleitet.');closeModal();state.supportLevel='second';render();toast('Übergabe mit vollständigem Kontext erfolgt.');break;
 case'propose-solution':{if(!t||!['first','second'].includes(t.status))break;const input=$('#solutionInput'),text=input.value.trim();if(!text){toast('Bitte die Lösung oder die nächsten Schritte dokumentieren.');input.focus();break;}if(!$('#approval').checked){toast('Bitte die fachliche Prüfung und Freigabe bestätigen.');$('#approval').focus();break;}const draft=$('#noteInput')?.value.trim();if(draft){toast('Speichern Sie zuerst Ihre offene Bearbeitungsnotiz.');$('#noteInput').focus();break;}t.solution=text;t.handledLevel=t.status==='second'?'second':'first';t.status='waiting';log(t,'Geprüfte Lösung zur Bestätigung gesendet.',supportPerson());t.messages.push({who:supportPerson(),text,time:stamp()});if(currentTicket()?.id===t.id)msg('support',text);render();toast('Lösung gesendet. Nun zur hilfesuchenden Person wechseln.');break;}
 case'back-user':if(!t)break;state.role='user';state.page='tickets';state.session.user=t.user;state.session.department=t.department;state.selected=t.id;render();break;
 case'confirm-user':if(!t||t.status!=='waiting')break;t.status='closed';log(t,'Lösung bestätigt und Ticket abgeschlossen.',t.user);if(currentTicket()?.id===t.id){state.session.phase='done';msg('user','Die Lösung hat geholfen. Das Problem ist gelöst.');msg('system','Ticket #'+t.id+' ist nach Ihrer Bestätigung abgeschlossen.');}render();toast('Lösung bestätigt – Ticket abgeschlossen.');break;
 case'reopen-user':if(!t||t.status!=='waiting')break;t.status=t.handledLevel==='second'?'second':'first';t.owner=t.handledLevel==='second'?KB[t.rule].team:'Service Desk';log(t,'Lösung nicht erfolgreich. Zur weiteren Bearbeitung zurückgegeben.',t.user);t.messages.push({who:t.user,text:'Das Problem besteht weiterhin. Bitte weiter prüfen.',time:stamp()});if(currentTicket()?.id===t.id){msg('user','Das Problem besteht weiterhin.');msg('system','Das Ticket wurde zur weiteren Bearbeitung zurückgegeben.');}render();toast('Ticket zur weiteren Bearbeitung zurückgegeben.');break;
 case'knowledge-review':if(!t||t.status!=='closed'||t.knowledge!=='Nicht vorgemerkt')break;t.knowledge='Zur fachlichen Wissensprüfung vorgemerkt';log(t,'Lösungsdokumentation zur Wissensprüfung vorgemerkt. Keine automatische Veröffentlichung.',supportPerson());render();toast('Für manuelle Prüfung vorgemerkt, nicht veröffentlicht.');break;
 case'reset-confirm':openModal('Gesamte Demo zurücksetzen?','<p>Alle Tickets, Dialoge, Prüfergebnisse und Notizen in diesem Tab werden gelöscht. Die Beispieldatei bleibt unverändert.</p><div class="actions">'+button('reset','Ja, Demo zurücksetzen','primary')+button('close','Abbrechen','')+'</div>');break;
 case'reset':closeModal();state=fresh();render();toast('Demo zurückgesetzt.');break;
}}
document.addEventListener('click',e=>{if(e.target.closest('#aboutBtn')){explain();return;}if(e.target.closest('#closeModal')){closeModal();return;}if(e.target.classList.contains('modal-backdrop')){closeModal();return;}const el=e.target.closest('[data-action]');if(el)handle(el.dataset.action,el);});
document.addEventListener('submit',e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const input=$('#chatInput');sendChat(input.value);const next=$('#chatInput');if(next&&!next.disabled)next.focus();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const modal=$('.modal');if(modal&&e.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not(:disabled),a,input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='impact'){state.session.impact=el.value;render();return;}const t=state.tickets.find(x=>x.id===Number(el.dataset.id));if(!t)return;if(el.dataset.check){const list=t[el.dataset.check];const check=list[Number(el.dataset.index)];if(check){check.done=el.checked;log(t,(check.done?'Geprüft: ':'Prüfung wieder geöffnet: ')+check.text,supportPerson());}return;}if(el.id==='categorySelect'){const r=KB[el.value];t.rule=r.id;t.category=r.category;t.routingReason=r.reason;if(t.status==='second')t.owner=r.team;const newChecks=r.checks.map(text=>({text,done:t.checks.some(c=>c.text===text&&c.done)}));const newExpert=r.expert.map(text=>({text,done:t.expert.some(c=>c.text===text&&c.done)}));t.checks=newChecks;t.expert=newExpert;log(t,'Kategorie durch Support korrigiert: '+r.category+'.',supportPerson());render();toast('Kategorie und Fachteam-Vorschlag aktualisiert.');}if(el.id==='prioritySelect'){t.priority=el.value;log(t,'Priorität manuell geprüft: '+el.value+'.',supportPerson());render();toast('Priorität aktualisiert.');}});
document.addEventListener('input',e=>{if(e.target.id==='kbSearch'){state.kbSearch=e.target.value;const query=normalize(state.kbSearch);$('#kbResults').innerHTML=kbCards(RULES.filter(r=>normalize(r.title+' '+r.category+' '+r.words.join(' ')).includes(query)));}});
render();
</script>
</body>
</html>
